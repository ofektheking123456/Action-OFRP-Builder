name: Build OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'Device Tree Repository URL'
        required: true
        default: 'https://github.com/Mayuri-Chan/recovery_device_xiaomi_tanzanite'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch (Leave empty for default branch)'
        required: false
        default: ''
      DEVICE_PATH:
        description: 'Device Tree Path'
        required: true
        default: 'device/xiaomi/tanzanite'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'tanzanite'
      MAKEFILE_NAME:
        description: 'Target Makefile Name (tw_tanzanite or omni_tanzanite)'
        required: true
        default: 'twrp_tanzanite'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Workflow
      uses: actions/checkout@v4

    - name: Cleanup Runner Workspace
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
        sudo apt-get clean

    - name: Prepare Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache flex bison gperf libssl-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig curl git repo \
          zip tar bc cpio libstdc++6 python3
        
    - name: Free Disk Space & Setup Swap
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
        
        # Disable and remove existing swapfile if present
        sudo swapoff -a || true
        sudo rm -f /swapfile
        
        # Allocate 8GB swap safely
        sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        
        # Fallback manual repo installation if apt repo is outdated
        if ! command -v repo &> /dev/null; then
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          sudo mv ~/bin/repo /usr/local/bin/repo
        fi

    - name: Set up Git Identity
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Sync Minimal Manifest
      run: |
        mkdir -p workspace
        cd workspace
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
          -b twrp-${{ github.event.inputs.MANIFEST_BRANCH }} \
          --depth=1 \
          --no-clone-bundle
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all) --force-sync

    - name: Clone OrangeFox Vendor Sync Script
      run: |
        cd workspace
        git clone https://gitlab.com/OrangeFox/vendor/recovery.git vendor/recovery --depth=1

    - name: Clone Device Tree
      run: |
        cd workspace
        BRANCH_FLAG=""
        if [ -n "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" ]; then
          BRANCH_FLAG="-b ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        fi
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} $BRANCH_FLAG ${{ github.event.inputs.DEVICE_PATH }}

    - name: Set up ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ github.event.inputs.DEVICE_NAME }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ github.event.inputs.DEVICE_NAME }}-

    - name: Building Recovery
      run: |
        cd workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        export DISABLE_ARTIFACT_PATH_REQUIREMENTS=true
        export FOX_BUILD_TYPE="Unofficial"
        export LC_ALL="C"
        export TW_DEFAULT_LANGUAGE="en"
        
        # ccache setup
        export USE_CCACHE=1
        export CCACHE_EXEC=$(which ccache)
        export CCACHE_DIR=~/.ccache
        export CCACHE_MAXSIZE=10G
        export CCACHE_COMPRESS=1
        ccache -M 10G
        
        # Display settings
        export TW_THEME="portrait_hdpi"
        export TARGET_SCREEN_WIDTH=1080
        export TARGET_SCREEN_HEIGHT=2400
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1
        
        source build/envsetup.sh
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng || lunch ${{ github.event.inputs.MAKEFILE_NAME }}-userdebug
        
        # Compile target directly
        mka recoveryimage -j$(nproc --all)

    - name: Prepare Build Artifacts
      run: |
        mkdir -p output/
        
        # Search workspace/out and workspace/FoxFiles for build outputs
        find workspace/out/target/product/ -type f \( -name "OrangeFox*.zip" -o -name "recovery.img" -o -name "boot.img" \) -exec cp {} output/ \; 2>/dev/null || true
        find workspace/FoxFiles/ -type f -exec cp {} output/ \; 2>/dev/null || true
        
        # Verify if any files were copied
        echo "=== Files ready for release ==="
        ls -la output/

    - name: Upload Artifacts to Release
      uses: softprops/action-gh-release@v2
      with:
        files: output/*
        tag_name: OFRP-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        name: OrangeFox Unofficial for ${{ github.event.inputs.DEVICE_NAME }}
        body: |
          Automated OrangeFox Recovery Build
          - **Device**: ${{ github.event.inputs.DEVICE_NAME }}
          - **Branch**: ${{ github.event.inputs.MANIFEST_BRANCH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
