name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          echo "Disk space cleaned."

      - name: Install Build Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig git repo ccache python3 python-is-python3

      - name: Setup Git Credentials & Environment
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global credential.helper ""
          echo "GIT_TERMINAL_PROMPT=0" >> $GITHUB_ENV

      - name: Initialize and Sync Minimal AOSP TWRP Manifest
        run: |
          mkdir -p $HOME/foxdata
          cd $HOME/foxdata
          
          # Use platform_manifest_twrp_aosp for Android 10+ (12.1)
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          
          # Force sync without git prompts
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree
        run: |
          cd $HOME/foxdata
          git clone https://github.com/ofektheking123456/Redmi-note-14-4g-orangefox -b main device/xiaomi/tanzanite --depth=1

      - name: Build OrangeFox Recovery
        run: |
          cd $HOME/foxdata
          export CCACHE_DIR=$HOME/foxdata/.ccache
          export CCACHE_EXEC=/usr/bin/ccache
          export USE_CCACHE=1
          ccache -M 10G

          source build/envsetup.sh
          lunch twp_tanzanite-eng || lunch twp_tanzanite-userdebug || lunch omni_tanzanite-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Output Build
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite
          path: |
            $HOME/foxdata/out/target/product/tanzanite/*.img
            $HOME/foxdata/out/target/product/tanzanite/*.zip
