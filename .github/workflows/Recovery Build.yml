name: Recovery Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/tanzanite

      - name: Install Build Dependencies & Repo Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig rsync python3

          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync OrangeFox Source
        run: |
          export PATH="$HOME/bin:$PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone https://gitlab.com/OrangeFox/sync.git ~/OFRP_Sync
          cd ~/OFRP_Sync
          ./orangefox_sync.sh --branch 12.1 --path $GITHUB_WORKSPACE/fox_12.1 || true

      - name: Copy Device Tree & Fix Vendor Path
        run: |
          # 1. Copy device tree
          mkdir -p $GITHUB_WORKSPACE/fox_12.1/device/xiaomi/tanzanite
          cp -r $GITHUB_WORKSPACE/device/xiaomi/tanzanite/* $GITHUB_WORKSPACE/fox_12.1/device/xiaomi/tanzanite/

          # 2. Fix missing vendor/fox path by symlinking vendor/recovery or vendor/twrp to vendor/fox
          cd $GITHUB_WORKSPACE/fox_12.1/vendor
          if [ -d "recovery" ] && [ ! -d "fox" ]; then
            ln -s recovery fox
          elif [ -d "twrp" ] && [ ! -d "fox" ]; then
            ln -s twrp fox
          fi

      - name: Build OrangeFox Recovery
        run: |
          cd $GITHUB_WORKSPACE/fox_12.1
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=tanzanite
          export LC_ALL="C"

          set +e
          source build/envsetup.sh
          set -e

          lunch fox_tanzanite-eng || lunch twrp_tanzanite-eng || lunch omni_tanzanite-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite
          path: |
            fox_12.1/out/target/product/tanzanite/OrangeFox*.zip
            fox_12.1/out/target/product/tanzanite/recovery.img
            
