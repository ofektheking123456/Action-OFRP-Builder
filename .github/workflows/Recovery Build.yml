name: Build OrangeFox Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/tanzanite

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Initialize OrangeFox Sync
        run: |
          mkdir -p fox
          cd fox
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path $HOME/foxdata

      - name: Integrate Device Tree & Build Recovery
        run: |
          # Find the actual root directory containing repo manifest
          FOX_ROOT=$(dirname $(find $HOME/foxdata -name "build" -type d -maxdepth 2 | head -n 1))
          echo "Found Fox root at: $FOX_ROOT"
          
          # Copy device tree into synced source
          mkdir -p $FOX_ROOT/device/xiaomi/tanzanite
          cp -r device/xiaomi/tanzanite/* $FOX_ROOT/device/xiaomi/tanzanite/
          
          cd $FOX_ROOT
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=tanzanite
          export LC_ALL="C"
          
          source build/envsetup.sh
          
          lunch twrp_tanzanite-eng 2>/dev/null || lunch omni_tanzanite-eng 2>/dev/null || lunch fox_tanzanite-eng
          
          mka recoveryimage -j$(nproc --all)

      - name: Package Output Artifacts
        run: |
          mkdir -p output/
          find $HOME/foxdata/ -maxdepth 5 -type f \( -name "OrangeFox*.zip" -o -name "recovery.img" \) -exec cp {} output/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
          tag_name: orangefox-${{ github.run_id }}
          name: OrangeFox Recovery Build ${{ github.run_id }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
