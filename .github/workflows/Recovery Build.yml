name: Build OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/ofektheking123456/Redmi-note-14-4g-orangefox'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/xiaomi/tanzanite'
      DEVICE_NAME:
        description: 'Device Name'
        required: true
        default: 'tanzanite'
      MAKEFILE_NAME:
        description: 'Makefile Name'
        required: true
        default: 'twp_tanzanite'
      BUILD_TARGET:
        description: 'Build Target (recoveryimage or bootimage)'
        required: true
        default: 'recoveryimage'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cleanup & Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          echo "Disk space cleaned"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig git repo ccache python3 python-is-python3

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global credential.helper ""
          echo "GIT_TERMINAL_PROMPT=0" >> $GITHUB_ENV

      - name: Sync Minimal TWRP/Omni Source
        run: |
          mkdir -p $HOME/foxdata
          cd $HOME/foxdata
          
          # Use public GitHub mirror to avoid GitLab authentication requirements
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1
          
          # Force sync without git hooks or credential prompts
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree
        run: |
          cd $HOME/foxdata
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} $HOME/foxdata/${{ github.event.inputs.DEVICE_PATH }} --depth=1

      - name: Build Recovery
        run: |
          cd $HOME/foxdata
          export CCACHE_DIR=$HOME/foxdata/.ccache
          export CCACHE_EXEC=/usr/bin/ccache
          export USE_CCACHE=1
          ccache -M 10G

          source build/envsetup.sh
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng || lunch ${{ github.event.inputs.MAKEFILE_NAME }}-userdebug
          mka ${{ github.event.inputs.BUILD_TARGET }} -j$(nproc --all)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Recovery-${{ github.event.inputs.DEVICE_NAME }}
          path: |
            $HOME/foxdata/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
            $HOME/foxdata/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
