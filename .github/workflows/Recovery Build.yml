name: OrangeFox Recovery Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo

      - name: Sync OrangeFox Source & Build
        run: |
          export PATH="$HOME/bin:$PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p workspace && cd workspace
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox-12.1 --depth=1 --no-repo-verify
          repo sync -c --no-clone-bundle --no-tags --prune -j$(nproc --all)
          
          mkdir -p device/xiaomi/tanzanite
          cp -r $GITHUB_WORKSPACE/* device/xiaomi/tanzanite/

          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch fox_tanzanite-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite
          path: workspace/out/target/product/tanzanite/OrangeFox*.img
