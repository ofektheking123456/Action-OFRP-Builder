name: Build OrangeFox Recovery

on:
  workflow_dispatch:

env:
  MANIFEST_BRANCH: '12.1'
  DEVICE_PATH: 'device/xiaomi/tanzanite'
  DEVICE_NAME: 'tanzanite'
  MAKEFILE_NAME: 'fox_tanzanite'
  BUILD_TARGET: 'recovery'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space & Set up Environment
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/graalvm /var/lib/docker
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Sync OrangeFox Source
        run: |
          mkdir -p $HOME/foxdata
          cd $HOME/foxdata
          git clone https://gitlab.com/OrangeFox/sync.git sync_tool
          cd sync_tool
          export FOX_VERSION="${{ env.MANIFEST_BRANCH }}"
          ./orangefox_sync.sh --branch ${{ env.MANIFEST_BRANCH }} --path $HOME/foxdata

      - name: Setup Device Tree & Build
        run: |
          # Set exact root source path created by orangefox_sync.sh
          if [ -f "$HOME/foxdata/fox_${{ env.MANIFEST_BRANCH }}/build/envsetup.sh" ]; then
            FOX_ROOT="$HOME/foxdata/fox_${{ env.MANIFEST_BRANCH }}"
          elif [ -f "$HOME/foxdata/build/envsetup.sh" ]; then
            FOX_ROOT="$HOME/foxdata"
          else
            echo "Error: envsetup.sh not found in expected source locations."
            ls -la $HOME/foxdata
            exit 1
          fi

          echo "OrangeFox source root verified at: $FOX_ROOT"

          # Target device directory
          TARGET_DIR="$FOX_ROOT/${{ env.DEVICE_PATH }}"
          mkdir -p "$TARGET_DIR"

          # Copy ONLY device tree files quietly
          rsync -aq --exclude='.git' --exclude='.github' --exclude='foxdata' --exclude='fox' "$GITHUB_WORKSPACE/" "$TARGET_DIR/"

          cd "$FOX_ROOT"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE="${{ env.DEVICE_NAME }}"
          export LC_ALL="C"

          # Set build environment & lunch
          source build/envsetup.sh
          lunch ${{ env.MAKEFILE_NAME }}-eng || lunch ${{ env.MAKEFILE_NAME }}-userdebug

          # Start compilation
          mka ${{ env.BUILD_TARGET }}image -j$(nproc --all)

      - name: Prepare Upload Artifacts
        run: |
          mkdir -p output/
          find $HOME/foxdata/ -maxdepth 6 -type f \( -name "OrangeFox*.zip" -o -name "recovery.img" \) -exec cp {} output/ \;

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
          tag_name: orangefox-${{ env.DEVICE_NAME }}-${{ github.run_id }}
          name: OrangeFox Recovery for ${{ env.DEVICE_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
