name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean

      - name: Install Build Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig git repo ccache python3 python-is-python3

      - name: Setup Git Credentials & Environment
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global credential.helper ""
          echo "GIT_TERMINAL_PROMPT=0" >> $GITHUB_ENV

      - name: Sync Official OrangeFox 12.1 Source & Vendor
        run: |
          mkdir -p $HOME/OrangeFox_sync
          cd $HOME/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path $HOME/fox_12.1

      - name: Clone Device Tree
        run: |
          cd $HOME/fox_12.1
          git clone https://github.com/ofektheking123456/Redmi-note-14-4g-orangefox -b main device/xiaomi/tanzanite --depth=1

      - name: Build OrangeFox Recovery
        run: |
          cd $HOME/fox_12.1
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=tanzanite
          export LC_ALL="C"
          export CCACHE_DIR=$HOME/fox_12.1/.ccache
          export CCACHE_EXEC=/usr/bin/ccache
          export USE_CCACHE=1
          ccache -M 10G

          # Disable immediate exit on script error during envsetup
          set +e
          source build/envsetup.sh
          set -e

          lunch twp_tanzanite-eng || lunch omni_tanzanite-eng || lunch twp_tanzanite-userdebug
          mka recoveryimage -j$(nproc --all)

      - name: Prepare Release Files
        run: |
          mkdir -p $HOME/output
          cd $HOME/fox_12.1/out/target/product/tanzanite/
          cp -f recovery.img $HOME/output/OrangeFox-tanzanite-recovery.img || true
          cp -f OrangeFox*.zip $HOME/output/ || cp -f *.zip $HOME/output/ || true

      - name: Upload Artifact to Workflow Summary
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite
          path: $HOME/output/*

      - name: Publish Build to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.run_number }}
          name: OrangeFox Recovery for tanzanite // ${{ github.run_number }}
          body: |
            Unofficial OrangeFox Recovery build for Xiaomi Redmi Note 14 4G (`tanzanite`).
            Built automatically via GitHub Actions.
          files: |
            /home/runner/output/*.img
            /home/runner/output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
