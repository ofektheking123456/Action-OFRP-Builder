name: Build TWRP Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/tanzanite

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Initialize Repo and Sync
        run: |
          mkdir -p twrp
          cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Integrate Device Tree & Build target
        run: |
          # Move checkout to build tree
          mkdir -p twrp/device/xiaomi/tanzanite
          cp -r device/xiaomi/tanzanite/* twrp/device/xiaomi/tanzanite/
          
          cd twrp
          source build/envsetup.sh
          
          # Fallback target resolution if AndroidProducts.mk / Makefile isn't strictly named twrp_tanzanite
          lunch twrp_tanzanite-eng 2>/dev/null || lunch omni_tanzanite-eng 2>/dev/null || lunch twrp_tanzanite-userdebug
          
          mka recoveryimage -j$(nproc --all)

      - name: Package Output
        run: |
          mkdir -p output/
          find twrp/out/target/product/ -maxdepth 2 -name "*.img" -exec cp {} output/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
          tag_name: build-${{ github.run_id }}
          name: TWRP Recovery Build ${{ github.run_id }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
