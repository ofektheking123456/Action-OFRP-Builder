name: Building OrangeFox

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/ofektheking123456/device_xiaomi_tanzanite'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'fox'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/xiaomi/tanzanite'
      MAKEFILE_NAME:
        description: 'Makefile Name'
        required: true
        default: 'twrp_tanzanite'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'recovery'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
        sudo apt-get clean

    - name: Initialize workspace
      id: pwd
      run: |
        echo "workspace-folder=$GITHUB_WORKSPACE" >> $GITHUB_OUTPUT

    - name: Prepare build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache flex bison gperf libssl-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig curl
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+rx ~/bin/repo
        sudo mv ~/bin/repo /usr/local/bin/repo
        
    - name: Sync OrangeFox sources
      run: |
        mkdir -p fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        cd fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        repo init -u https://gitlab.com/OrangeFox/Manifest.git \
          -b fox_${{ github.event.inputs.MANIFEST_BRANCH }} \
          --depth=1 \
          --no-clone-bundle
          
        repo sync -c \
          --no-clone-bundle \
          --no-tags \
          --optimized-fetch \
          --prune \
          -j$(nproc --all) \
          --force-sync

    - name: Clone device tree
      run: |
        cd fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}

    - name: Set up ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-

    - name: Building recovery
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
      run: |
        export ALLOW_MISSING_DEPENDENCIES=true
        export DISABLE_ARTIFACT_PATH_REQUIREMENTS=true
        export FOX_BUILD_TYPE="Unofficial"
        export LC_ALL="C"
        export TW_DEFAULT_LANGUAGE="en"
        
        # Enable & Configure ccache
        export USE_CCACHE=1
        export CCACHE_EXEC=$(which ccache)
        export CCACHE_DIR=~/.ccache
        export CCACHE_MAXSIZE=10G
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=6
        ccache -M 10G
        ccache -z # Reset statistics to measure this run's hits
        
        # Display & Brightness settings
        export TW_THEME="portrait_hdpi"
        export TARGET_SCREEN_WIDTH=1080
        export TARGET_SCREEN_HEIGHT=2400
        export TW_MAX_BRIGHTNESS=2047
        export TW_DEFAULT_BRIGHTNESS=1200
        
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1
        
        set +e
        source build/envsetup.sh
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
        set -e
        
        if [ -f vendor/fox/fox_build.sh ]; then
          bash vendor/fox/fox_build.sh tanzanite
        else
          mka adbd recoveryimage bootimage vendor_bootimage -j$(nproc --all)
        fi
        
        # Print ccache statistics after completion
        ccache -s
    - name: Building recovery
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
      run: |
        export ALLOW_MISSING_DEPENDENCIES=true
        export DISABLE_ARTIFACT_PATH_REQUIREMENTS=true
        export FOX_BUILD_TYPE="Unofficial"
        export LC_ALL="C"
        export TW_DEFAULT_LANGUAGE="en"
        
        # Display & Brightness settings
        export TW_THEME="portrait_hdpi"
        export TARGET_SCREEN_WIDTH=1080
        export TARGET_SCREEN_HEIGHT=2400
        export TW_MAX_BRIGHTNESS=2047
        export TW_DEFAULT_BRIGHTNESS=1200
        
        # Enable OrangeFox build engine
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1
        
        set +e
        source build/envsetup.sh
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
        set -e
        
        make clean
        
        if [ -f vendor/fox/fox_build.sh ]; then
          bash vendor/fox/fox_build.sh tanzanite
        else
          mka adbd recoveryimage bootimage vendor_bootimage -j$(nproc --all)
        fi

    - name: Prepare build artifacts
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
      run: |
        mkdir -p ${{ steps.pwd.outputs.workspace-folder }}/artifacts/
        
        find out/target/product/tanzanite/ -maxdepth 3 \( -name "*.img" -o -name "OrangeFox*.zip" -o -name "Fox*.zip" \) -not -path "*/obj/*" -exec cp {} ${{ steps.pwd.outputs.workspace-folder }}/artifacts/ \;
        
        echo "=== Artifacts Found ==="
        ls -la ${{ steps.pwd.outputs.workspace-folder }}/artifacts/

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: always()
      with:
        files: ${{ steps.pwd.outputs.workspace-folder }}/artifacts/*
        name: OrangeFox-tanzanite-${{ github.run_id }}
        tag_name: build-${{ github.run_id }}
        body: |
          OrangeFox Recovery build for Redmi Note 14 4G (tanzanite).
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
