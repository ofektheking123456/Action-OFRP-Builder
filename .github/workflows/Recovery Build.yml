name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/linastorvaldz/recovery_xiaomi_tanzanite'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/tanzanite'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'tanzanite'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'fox_tanzanite'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      id: pwd
      run: |
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT

    - name: Prepare build environment
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        git config --global url."https://gitlab.com/".insteadOf "git@gitlab.com:"
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq linux-modules-extra-$(uname -r) git python3 tar aria2
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Sync OrangeFox sources
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        git clone ${{ github.event.inputs.SYNC_URL }}
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Clone device tree
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
      run: |
        rm -rf ${{ github.event.inputs.DEVICE_PATH }}
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }} || git clone ${{ github.event.inputs.DEVICE_TREE_URL }} ${{ github.event.inputs.DEVICE_PATH }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    
    - name: Building recovery
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
      run: |
        export ALLOW_MISSING_DEPENDENCIES=true
        export DISABLE_ARTIFACT_PATH_REQUIREMENTS=true
        export FOX_BUILD_TYPE="Unofficial"
        export LC_ALL="C"
        export TW_DEFAULT_LANGUAGE="en"
        
        # Screen resolution & brightness settings
        export TW_THEME="portrait_hdpi"
        export TARGET_SCREEN_WIDTH=1080
        export TARGET_SCREEN_HEIGHT=2400
        export TW_MAX_BRIGHTNESS=2047
        export TW_DEFAULT_BRIGHTNESS=1200
        
        set +e
        source build/envsetup.sh
        
        # Source OrangeFox build environment vars if available
        [ -f vendor/fox/vars/fox_env.sh ] && source vendor/fox/vars/fox_env.sh
        
        # Lunch target
        lunch twrp_tanzanite-eng || lunch fox_tanzanite-eng
        set -e
        
        make clean
        
        # Build OrangeFox recovery targets
        mka recoveryimage -j$(nproc --all) || mka bootimage -j$(nproc --all) || mka vendor_bootimage -j$(nproc --all)

    - name: Prepare build artifacts
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
      run: |
        mkdir -p ${{ steps.pwd.outputs.workspace-folder }}/artifacts/
        
        # Copy image files or zip packages generated in product dir
        find out/target/product/tanzanite/ -maxdepth 2 -type f \( -name "*.img" -o -name "*.zip" \) -exec cp {} ${{ steps.pwd.outputs.workspace-folder }}/artifacts/ \;
        
        echo "=== Artifacts Found ==="
        ls -la ${{ steps.pwd.outputs.workspace-folder }}/artifacts/

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.pwd.outputs.workspace-folder }}/artifacts/*
        name: OrangeFox-tanzanite-${{ github.run_id }}
        tag_name: build-${{ github.run_id }}
        body: |
          OrangeFox Recovery build for Redmi Note 14 4G (tanzanite).
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
