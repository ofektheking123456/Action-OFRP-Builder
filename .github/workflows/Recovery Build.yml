name: Build OrangeFox Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/tanzanite

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Initialize OrangeFox Sync
        run: |
          mkdir -p fox
          cd fox
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path $HOME/foxdata

      - name: Integrate Device Tree & Build Recovery
        run: |
          # Detect the exact directory where build/envsetup.sh resides
          ENVSETUP=$(find $HOME/foxdata -name "envsetup.sh" | head -n 1)

          if [ -z "$ENVSETUP" ]; then
            echo "Error: build/envsetup.sh was not found!"
            exit 1
          fi

          FOX_ROOT=$(dirname $(dirname "$ENVSETUP"))
          echo "Targeting Fox root: $FOX_ROOT"

          # Create device tree directory in the synced Android source
          mkdir -p "$FOX_ROOT/device/xiaomi/tanzanite"

          # Copy checked out files into the build tree
          cp -r $GITHUB_WORKSPACE/device/xiaomi/tanzanite/* "$FOX_ROOT/device/xiaomi/tanzanite/"

          cd "$FOX_ROOT"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=tanzanite
          export LC_ALL="C"

          # Load build environment
          source build/envsetup.sh

          # Lunch target selection
          lunch twrp_tanzanite-eng || lunch omni_tanzanite-eng || lunch fox_tanzanite-eng || lunch twrp_tanzanite-userdebug

          # Start compilation
          mka recoveryimage -j$(nproc --all) || make recoveryimage -j$(nproc --all)

      - name: Package Output Artifacts
        run: |
          mkdir -p output/
          find $HOME/foxdata/ -maxdepth 6 -type f \( -name "OrangeFox*.zip" -o -name "recovery.img" \) -exec cp {} output/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
          tag_name: orangefox-${{ github.run_id }}
          name: OrangeFox Recovery Build ${{ github.run_id }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
