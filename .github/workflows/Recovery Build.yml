name: Build OrangeFox Recovery

on:
  workflow_dispatch:

env:
  MANIFEST_BRANCH: '12.1'
  DEVICE_PATH: 'device/xiaomi/tanzanite'
  DEVICE_NAME: 'tanzanite'
  MAKEFILE_NAME: 'fox_tanzanite'
  BUILD_TARGET: 'recovery'
  TW_THEME: 'portrait_hdpi'
  TARGET_SCREEN_WIDTH: '1080'
  TARGET_SCREEN_HEIGHT: '2400'
  TW_MAX_BRIGHTNESS: '255'
  TW_DEFAULT_BRIGHTNESS: '160'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space & Set up Environment
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/graalvm /var/lib/docker
          sudo apt update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Sync OrangeFox Source
        run: |
          mkdir -p $HOME/foxdata
          cd $HOME/foxdata
          GIT_TERMINAL_PROMPT=0 git clone --depth=1 https://gitlab.com/OrangeFox/sync_tool.git sync_tool || true
          
          if [ -d "sync_tool" ]; then
            cd sync_tool
            export FOX_VERSION="${{ env.MANIFEST_BRANCH }}"
            ./orangefox_sync.sh --branch ${{ env.MANIFEST_BRANCH }} --path $HOME/foxdata
          else
            echo "GitLab sync_tool clone failed, initializing repo directly..."
            cd $HOME/foxdata
            repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_${{ env.MANIFEST_BRANCH }} --depth=1
            repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          fi

      - name: Setup Device Tree & Build
        run: |
          if [ -d "$HOME/foxdata/fox_${{ env.MANIFEST_BRANCH }}" ]; then
            FOX_ROOT="$HOME/foxdata/fox_${{ env.MANIFEST_BRANCH }}"
          else
            FOX_ROOT="$HOME/foxdata"
          fi

          echo "OrangeFox source root set to: $FOX_ROOT"

          TARGET_DIR="$FOX_ROOT/${{ env.DEVICE_PATH }}"
          mkdir -p "$TARGET_DIR"
          rsync -aq --exclude='.git' --exclude='.github' --exclude='foxdata' --exclude='sync_tool' "$GITHUB_WORKSPACE/" "$TARGET_DIR/"

          # Download stock kernel into prebuilt directory dynamically
          mkdir -p "$TARGET_DIR/prebuilt"
          curl -sL "https://github.com/ofektheking123456/Action-OFRP-Builder/releases/download/kernel-v1/kernal" -o "$TARGET_DIR/prebuilt/kernel"

          cd "$FOX_ROOT"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE="${{ env.DEVICE_NAME }}"
          export TW_THEME="${{ env.TW_THEME }}"
          export TARGET_SCREEN_WIDTH="${{ env.TARGET_SCREEN_WIDTH }}"
          export TARGET_SCREEN_HEIGHT="${{ env.TARGET_SCREEN_HEIGHT }}"
          export TW_MAX_BRIGHTNESS="${{ env.TW_MAX_BRIGHTNESS }}"
          export TW_DEFAULT_BRIGHTNESS="${{ env.TW_DEFAULT_BRIGHTNESS }}"
          export LC_ALL="C"

          # Temporarily disable error exit to handle lunch evaluation safely
          set +e
          source build/envsetup.sh
          lunch ${{ env.MAKEFILE_NAME }}-eng || lunch ${{ env.MAKEFILE_NAME }}-userdebug || lunch omni_${{ env.DEVICE_NAME }}-eng || lunch tw_${{ env.DEVICE_NAME }}-eng
          LUNCH_STATUS=$?
          set -e

          if [ $LUNCH_STATUS -ne 0 ]; then
            echo "Failed to lunch product target."
            exit 1
          fi

          # Start compilation (forces full boot & recovery image target generation)
          mka recoveryimage bootimage vendor_bootimage -j$(nproc --all)

      - name: Prepare Upload Artifacts
        run: |
          mkdir -p output/

          # 1. Search root, foxdata out, and workspace for any built .zip or .img files
          find "$HOME/foxdata/out/" -type f \( -name "OrangeFox*.zip" -o -name "*.img" \) -exec cp {} output/ \; 2>/dev/null || true
          find $GITHUB_WORKSPACE -type f \( -name "OrangeFox*.zip" -o -name "*.img" \) -exec cp {} output/ \; 2>/dev/null || true

          # 2. Print output contents to logs to double check
          echo "=== FINAL OUTPUT CONTENTS ==="
          ls -la output/

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "OFRP-tanzanite-${{ github.run_number }}"
          name: "OrangeFox Recovery Build #${{ github.run_number }}"
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
