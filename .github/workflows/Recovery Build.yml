name: OrangeFox - Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      - name: Build OrangeFox Recovery
        uses: UWU-TEAM/UWU-OrangeFox-Builder@v1.0.0
        with:
          USER_NAME: 'Syntax'
          USER_EMAIL: 'builder@github.com'
          DEVICE_TREE: 'https://github.com/ofektheking123456/Redmi-note-14-4g-orangefox'
          DEVICE_TREE_BRANCH: 'main'
          DEVICE_PATH: 'device/xiaomi/tanzanite'
          DEVICE_NAME: 'tanzanite'
          BUILD_TARGET: 'recovery'
          GH_RELEASE: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
